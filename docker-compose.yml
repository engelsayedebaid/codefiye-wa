# Self-hosted stack (README §11 "launch" stage) with a local Postgres instead of Neon.
# Not exercised on the dev machine (no Docker there) — verify before relying on it.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: wa
      POSTGRES_PASSWORD: wa
      POSTGRES_DB: wa
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wa"]
      interval: 5s
      retries: 10

  api:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment: &env
      DATABASE_URL: postgresql://wa:wa@postgres:5432/wa
      AUTH_ENCRYPTION_KEY: ${AUTH_ENCRYPTION_KEY:?set AUTH_ENCRYPTION_KEY}
      WORKER_SECRET: ${WORKER_SECRET:?set WORKER_SECRET}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:4000}
    ports:
      - "4000:4000"

  worker:
    build: .
    command: ["pnpm", "--filter", "@wa/worker", "start"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *env
      WORKER_ID: worker-1
      WORKER_HOST: 0.0.0.0
      WORKER_URL: http://worker:4100
    # Give in-flight sends time to finish and sockets time to close.
    stop_grace_period: 20s

volumes:
  pgdata:
