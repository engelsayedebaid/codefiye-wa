<!doctype html>
<html lang="ar" dir="rtl" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#070e0c" />
    <title>WA CodeFiye — واتساب API منخفض التكلفة للمطوّرين</title>
    <meta name="description" content="أرسل واستقبل رسائل واتساب من تطبيقك عبر REST API بسيط: جلسات متعددة، رسائل غير محدودة، وبدون رسوم على كل رسالة." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=Instrument+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      // Apply the saved language before first paint, so the page doesn't flip direction on load.
      try {
        if (localStorage.getItem('wa.lang') === 'en') {
          document.documentElement.lang = 'en';
          document.documentElement.dir = 'ltr';
        }
      } catch {}
      // Same for the theme (src/theme.tsx): dark unless the visitor picked light, or system on a light device.
      try {
        var pref = localStorage.getItem("wa.theme");
        var light = pref === "light" || (pref === "system" && !matchMedia("(prefers-color-scheme: dark)").matches);
        if (light) {
          document.documentElement.dataset.theme = "light";
          document.querySelector("meta[name=theme-color]").setAttribute("content", "#f8faf9");
        }
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
