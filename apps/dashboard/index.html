<!doctype html>
<html lang="ar" dir="rtl" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#e3e6e0" />
    <title>WA CodeFiye — منصّة واتساب للأعمال: API ومحادثات وحملات</title>
    <meta name="description" content="اربط أرقام واتساب لشركتك، وأرسل من أنظمتك عبر REST API، وأدِر المحادثات والحملات من لوحة تحكم واحدة — رسائل غير محدودة وبدون رسوم على الرسالة." />
    <!-- Link previews (WhatsApp, Facebook, X, Slack…) when the site is shared. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="WA CodeFiye" />
    <meta property="og:locale" content="ar_AR" />
    <meta property="og:title" content="WA CodeFiye — منصّة واتساب للأعمال" />
    <meta property="og:description" content="REST API ومحادثات مباشرة وحملات بحماية للأرقام — رسائل غير محدودة وبدون رسوم على الرسالة." />
    <meta name="twitter:card" content="summary" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Instrument+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      // Apply the saved language before first paint, so the page doesn't flip direction on load.
      try {
        if (localStorage.getItem('wa.lang') === 'en') {
          document.documentElement.lang = 'en';
          document.documentElement.dir = 'ltr';
        }
      } catch {}
      // Same for the theme (src/theme.tsx): light unless the visitor picked dark, or system on a dark device.
      try {
        var pref = localStorage.getItem("wa.theme");
        var dark = pref === "dark" || (pref === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
        if (dark) {
          document.documentElement.dataset.theme = "dark";
          document.querySelector("meta[name=theme-color]").setAttribute("content", "#102018");
        }
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
